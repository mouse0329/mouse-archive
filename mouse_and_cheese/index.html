<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />

    <!-- タイトルは検索に強くする -->
    <title>ネズミとチーズゲーム｜無料で遊べるブラウザゲーム</title>

    <!-- ページの説明文（検索結果に出る） -->
    <meta name="description" content="ネズミを操作してチーズを集める無料ブラウザゲーム！スマホやPCで手軽に遊べる、かわいい暇つぶしゲームです。">

    <!-- キーワード（最近は効果薄いけど一応） -->
    <meta name="keywords" content="ネズミ,チーズ,ゲーム,無料,ブラウザ,暇つぶし,かわいい">

    <!-- OGP（SNSシェア時のカード表示） -->
    <meta property="og:title" content="ネズミとチーズゲーム｜無料で遊べるブラウザゲーム">
    <meta property="og:description" content="かわいいネズミを動かしてチーズをキャッチ！スマホでもPCでも無料で遊べるブラウザゲーム。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://example.com/game">
    <meta property="og:image" content="https://example.com/imgs/ogp-cheese.png">

    <!-- Twitterカード -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ネズミとチーズゲーム">
    <meta name="twitter:description" content="チーズを集めるかわいい無料ブラウザゲーム！">
    <meta name="twitter:image" content="https://example.com/imgs/ogp-cheese.png">
    <link rel="stylesheet" href="mouse_and_cheese.css" />
</head>


<body>
    <div id="game">
        <!--TODO:ネズミがモバイルの時に行くバグ-->
        <div class="mouse" id="mouse">
        </div>

        <div id="window"></div>
        <div id="cheeseCount">チーズ:0</div>
        <div id="statusBar"></div>
        <button id="pauseBtn">⏸ 一時停止</button>
        <div class="overlay">
            <img src="/imgs/mouse-txt.webp" alt="ネズミのアイコン">
        </div>
    </div>

    <!-- 管理パネル/デバッグパネルを統合し、URLパラメータ debug または admin のときのみ表示 -->
    <button id="adminBtn"
        style="display:none;position:fixed;left:10px;bottom:10px;z-index:2001;font-size:14px;padding:4px 10px;border-radius:8px;">管理・デバッグ</button>
    <div id="adminPanel"
        style="display:none;position:fixed;left:10px;bottom:50px;z-index:2002;background:#fff;border:1px solid #aaa;padding:12px 16px;border-radius:12px;box-shadow:0 2px 8px #0002;max-width:360px;">
        <div style="font-weight:bold;margin-bottom:6px;">管理・デバッグ設定</div>
        <form id="adminForm">
            <div style="margin-bottom:4px;">
                <label>コイン <input type="number" min="0" id="dbg_coins" style="width:80px;"></label>
            </div>
            <div style="margin-bottom:4px;">
                <label>ハイスコア <input type="number" min="0" id="dbg_high" style="width:80px;"></label>
            </div>
            <div style="margin-bottom:4px;">
                <label>チーズ出現率 <input type="number" step="0.01" min="0" max="1" id="ap_cheese"
                        style="width:60px;"></label>
            </div>
            <div style="margin-bottom:4px;">
                <label>レアチーズ出現率 <input type="number" step="0.01" min="0" max="1" id="ap_rare"
                        style="width:60px;"></label>
            </div>
            <div style="margin-bottom:4px;">
                <label>虹出現率 <input type="number" step="0.01" min="0" max="1" id="ap_rainbow"
                        style="width:60px;"></label>
            </div>
            <div style="margin-bottom:4px;">
                <label>水最低確率 <input type="number" step="0.01" min="0" max="1" id="ap_minWater"
                        style="width:60px;"></label>
            </div>
            <div style="margin-bottom:4px;">
                <label>やさしい: 落下間隔(ms) <input type="number" min="100" max="5000" id="ap_easy_drop"
                        style="width:60px;"></label>
                <label>速度 <input type="number" min="1" max="50" id="ap_easy_speed" style="width:40px;"></label>
            </div>
            <div style="margin-bottom:4px;">
                <label>ふつう: 落下間隔(ms) <input type="number" min="100" max="5000" id="ap_normal_drop"
                        style="width:60px;"></label>
                <label>速度 <input type="number" min="1" max="50" id="ap_normal_speed" style="width:40px;"></label>
            </div>
            <div style="margin-bottom:4px;">
                <label>むずかしい: 落下間隔(ms) <input type="number" min="100" max="5000" id="ap_hard_drop"
                        style="width:60px;"></label>
                <label>速度 <input type="number" min="1" max="50" id="ap_hard_speed" style="width:40px;"></label>
            </div>
            <div style="margin-bottom:4px;">
                <label>虹コスト <input type="text" id="dbg_costRainbow" style="width:120px;"></label>
            </div>
            <div style="margin-bottom:4px;">
                <label>レアコスト <input type="text" id="dbg_costRare" style="width:120px;"></label>
            </div>
            <div style="margin-bottom:4px;">
                <label>虹バフ時間コスト <input type="text" id="dbg_costRainbowTime" style="width:120px;"></label>
            </div>
            <div style="margin-bottom:4px;">
                <label>虹チーズコスト <input type="text" id="dbg_costRainbowCheese" style="width:120px;"></label>
            </div>
            <button type="submit" style="margin-top:8px;">保存してリロード</button>
            <button type="button" id="adminClose" style="margin-left:8px;">閉じる</button>
            <button type="button" id="adminReset" style="margin-left:8px;">リセット</button>
            <button type="button" id="adminExport" style="margin-left:8px;">JSON書き出し</button>
            <label style="margin-left:8px;cursor:pointer;">
                <input type="file" id="adminImport" accept="application/json" style="display:none;">
                <span style="text-decoration:underline;color:#06c;">JSON読込</span>
            </label>
        </form>
        <div style="font-size:12px;color:#888;margin-top:4px;">※編集はlocalStorageに保存されます</div>
    </div>
    <button id="debugBtn"
        style="display:none;position:fixed;left:120px;bottom:10px;z-index:2001;font-size:14px;padding:4px 10px;border-radius:8px;">デバッグ</button>
    <div id="debugPanel"
        style="display:none;position:fixed;left:120px;bottom:50px;z-index:2002;background:#fff;border:1px solid #aaa;padding:12px 16px;border-radius:12px;box-shadow:0 2px 8px #0002;max-width:340px;">
        <div style="font-weight:bold;margin-bottom:6px;">デバッグ設定</div>
        <form id="debugForm">
            <div style="margin-bottom:4px;">
                <label>コイン <input type="number" min="0" id="dbg_coins" style="width:80px;"></label>
            </div>
            <div style="margin-bottom:4px;">
                <label>ハイスコア <input type="number" min="0" id="dbg_high" style="width:80px;"></label>
            </div>
            <div style="margin-bottom:4px;">
                <label>虹コスト <input type="text" id="dbg_costRainbow" style="width:120px;"></label>
            </div>
            <div style="margin-bottom:4px;">
                <label>レアコスト <input type="text" id="dbg_costRare" style="width:120px;"></label>
            </div>
            <div style="margin-bottom:4px;">
                <label>虹バフ時間コスト <input type="text" id="dbg_costRainbowTime" style="width:120px;"></label>
            </div>
            <div style="margin-bottom:4px;">
                <label>虹チーズコスト <input type="text" id="dbg_costRainbowCheese" style="width:120px;"></label>
            </div>
            <button type="submit" style="margin-top:8px;">保存してリロード</button>
            <button type="button" id="debugClose" style="margin-left:8px;">閉じる</button>
            <button type="button" id="debugReset" style="margin-left:8px;">リセット</button>
            <button type="button" id="debugExport" style="margin-left:8px;">JSON書き出し</button>
            <label style="margin-left:8px;cursor:pointer;">
                <input type="file" id="debugImport" accept="application/json" style="display:none;">
                <span style="text-decoration:underline;color:#06c;">JSON読込</span>
            </label>
        </form>
        <div style="font-size:12px;color:#888;margin-top:4px;">※編集はlocalStorageに保存されます</div>
    </div>
    <script src="mouse_and_cheese.js"></script>
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VideoGame",
  "name": "ネズミとチーズゲーム",
  "genre": "カジュアルゲーム",
  "playMode": "SinglePlayer",
  "applicationCategory": "Game",
  "operatingSystem": "Web",
  "description": "ネズミを動かしてチーズを集める無料ブラウザゲーム。スマホやPCで遊べます。",
  "url": "https://example.com/game",
  "image": "https://example.com/imgs/ogp-cheese.png"
}
</script>
</body>

</html>
