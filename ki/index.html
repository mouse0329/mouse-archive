<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>localStorage 自動バックアップとリダイレクト</title>
</head>

<body>
    <h1>シンセサイザーは移動しました。いまからダウンロードされるファイルを移動先で読ませてください何卒よろしくお願いします。</h1>

    <script>
        (function () {
            // localStorageをJSON化
            const storageObj = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                storageObj[key] = localStorage.getItem(key);
            }

            const json = JSON.stringify(storageObj, null, 2);
            const blob = new Blob([json], { type: "application/json" });
            const url = URL.createObjectURL(blob);

            // 自動ダウンロード
            const a = document.createElement("a");
            a.href = url;
            a.download = "localStorage_backup.json";
            document.body.appendChild(a); // Firefox向け
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // 5秒後にリダイレクト
            setTimeout(() => {
                window.location.href = "https://synthesizer-chu-web.netlify.app/";
            }, 5000);
        })();
    </script>
</body>

</html>
