<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>デジタルシンセサイザーweb</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>デジタルシンセサイザーweb</h2>
    <div class="controls">
        楽器:
        <select id="instrument">
            <option value="sine">サイン波</option>
            <option value="piano">ピアノ</option>
            <option value="violin">バイオリン</option>
            <option value="clarinet">クラリネット</option>
            <option value="flute">フルート</option>
            <option value="brass">ブラス</option>
            <option value="sax">サックス</option>
            <option value="guitar">ギター</option>
            <option value="bass">ベース</option>
            <option value="marimba">マリンバ</option>
            <option value="vibraphone">ビブラフォン</option>
            <option value="organ">オルガン</option>
            <option value="synth">シンセ</option>
            <option value="square">矩形波</option>
            <option value="triangle">三角波</option>
            <option value="sawtooth">ノコギリ波</option>
        </select>
        <label><input type="checkbox" id="showNoteLabel" checked> 鍵盤に音符表示</label>
        <button id="openModal">マッピング設定</button>
        <button id="openWaveKeyModal">楽器キー設定</button>
        <button id="editInstrumentParam" style="margin-left:10px;">楽器パラメータ編集</button>
        <label style="margin-left:10px;font-weight:bold;">
            オクターブ:
            <input id="octaveInput" type="number" value="0" min="-4" max="4" style="width:50px;text-align:right;">
        </label>
        <label style="margin-left:10px;font-weight:bold;">
            移調:
            <input id="transposeInput" type="number" value="0" min="-24" max="24" style="width:50px;text-align:right;">
        </label>
        <button id="clearLocalStorage" style="margin-left:10px;">ローカルストレージ削除</button>
    </div>
    <div id="keyboard"></div>
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h3>マッピング設定</h3>
            <table id="mappingTable">
                <tr>
                    <th>順番</th>
                    <th>キー</th>
                    <th>音</th>
                    <th>色</th>
                </tr>
            </table>
            <button id="addMapping">新しいマッピングを追加</button>
        </div>
    </div>
    <!-- 波形ファンクションキー設定用モーダル -->
    <div id="waveKeyModal" class="modal">
        <div class="modal-content">
            <span class="wavekey-modal-close"
                style="float:right;cursor:pointer;font-weight:bold;font-size:20px;color:#888;">&times;</span>
            <h3>波形ファンクションキー設定</h3>
            <table id="waveKeyTable" style="width:100%;margin-bottom:10px;">
                <tr>
                    <th>ファンクションキー</th>
                    <th>楽器</th>
                </tr>
            </table>
            <button id="resetWaveKeyMap">デフォルトに戻す</button>
        </div>
    </div>

    <!-- ようこそモーダル -->
    <div id="welcomeModal" class="modal" style="z-index:20;">
        <div class="modal-content" style="text-align:center;">
            <span id="welcomeClose"
                style="float:right;cursor:pointer;font-weight:bold;font-size:20px;color:#888;">&times;</span>
            <h2>ようこそ！</h2>
            <p>デジタルシンセサイザーwebへようこそ。<br>
                <small>（この画面は初回のみ表示されます）</small>
            </p>
            <ul style="text-align:left;max-width:350px;margin:0 auto 1em;">
                <li>キーボードで演奏できます</li>
                <li>波形やマッピングは自由にカスタマイズ可能</li>
                <li>ファンクションキーで波形切替・矢印キーでオクターブ/移調</li>
                <li>設定はローカルストレージに保存されます</li>
            </ul>
            <button id="welcomeOk" style="padding:8px 24px;font-size:16px;">OK</button>
        </div>
    </div>

    <!-- 楽器パラメータ編集モーダル -->
    <div id="instrumentParamModal" class="modal">
        <div class="modal-content" style="max-width:400px;">
            <span id="instrumentParamClose"
                style="float:right;cursor:pointer;font-weight:bold;font-size:20px;color:#888;">&times;</span>
            <h3>楽器パラメータ編集</h3>
            <div id="instrumentParamForm"></div>
            <button id="instrumentParamSave">保存</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
